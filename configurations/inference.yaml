# Inference entry point: `python infer.py input=<video or image folder>`, or ugg.UGG in Python.
# Every key below, and every algorithm/dataset key, can be overridden Hydra-style, e.g.
#   python infer.py input=clip.mp4 mode=sparse seed=1 algorithm.sample_steps=20 algorithm.hist_guidance=2.0
defaults:
  - experiment: exp_video
  - dataset: video_inference
  - algorithm: ugg
  - _self_

debug: false

task: video              # video | image | first_last | text | camera | depth   (what is given; see README)
input: null              # video / image folder (video), first image (image, first_last; optional anchor for depth)
last: null               # last image (first_last; optional anchor for depth)
cameras: null            # .npz with c2w (T,4,4) + intrinsics (3,3 | T,3,3) at 288x384 (image, first_last, camera)
depth: null              # .npz / .npy with depth (T,H,W) (depth)
num_frames: 50           # clip length when no video gives it (image without cameras, text)
output_dir: outputs/infer
mode: dense              # task=video only. dense: every frame is given | sparse: only the first and last
prompt: null             # optional caption; loads the T5 text encoder (~11 GB) on first use
seed: 0                  # protocol seed for depth/pose (the NVS harness uses 42)
max_frames: 50           # clip length cap; the used length is the largest M <= cap with M % 4 == 2
frame_mode: contig_first # contig_first (the protocol) | uniform (spread over the whole video)
shared_intrinsics: true  # fit one K per clip when recovering cameras (recommended)
percentile_clip: 2.0     # disparity floor for depth decoding; 10 measured better outdoors
dit_bf16: true           # run the DiT in bf16
device: cuda

# Inference encodes with the plain eager VAE (no compile warm-up).
algorithm:
  vae:
    encoder_compile: false
    merge_flf_chunks: false

hydra:
  run:
    dir: ${output_dir}
  output_subdir: null
