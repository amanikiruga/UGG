defaults:
  - video_base
  - _self_

# MatrixCity (UE5 synthetic city): street split only (the aerial split is a grid scan, not
# continuous video). 1000x1000 fov-90 RGB, float16 EXR z-depth in the pose unit, OpenCV c2w with
# 0.01-scaled rotations (normalized in the loader). Records are contiguous sweeps, split at teleports.
data_root: ${data_dir}/matrixcity
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/matrixcity
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
fps: 10
fps_source: 10
n_frames: 50
test_percentage: 0.02
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale: max(P90 of the per-clip moment max, P90 depth / 9), in metres.
mutual_scale: 12.21   # metres

# The poses drift over long baselines while the depth is sound, so only depth is used:
# depth_only omits the camera keys (has_raymap=False).
depth_only: true

# Depth and pose translation are in centimetres (the UE5 world unit). This does not affect
# scale_mode=parallax, which normalizes by the clip's own median depth.
unit_to_meters: 0.01

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json

# Static scenes: a time-reversed clip is a valid backward camera path.
allow_temporal_reverse: true
