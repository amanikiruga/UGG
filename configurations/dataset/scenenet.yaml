defaults:
  - video_base
  - _self_

data_root: ${data_dir}/scenenet
gt_pose_root: ${data_dir}/scenenet_gt_poses
metadata_path: metadata.csv
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/scenenet
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
fps: 10
n_frames: 49
test_percentage: 0.0
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
