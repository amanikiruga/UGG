defaults:
  - video_base
  - tartanair@subset/tartanair
  - tartanair_v2@subset/tartanair_v2
  - spring@subset/spring
  - bedlam@subset/bedlam
  - bedlam2@subset/bedlam2
  - vkitti2@subset/vkitti2
  - ase@subset/ase
  - omniworld_game@subset/omniworld_game
  - re10k@subset/re10k
  - dl3dv_colmap@subset/dl3dv_colmap
  - _self_

# Base geometry mixture (extended by mixture_parallax14). Every subset yields OpenCV c2w relative
# to the first frame and depth as disparity 2/(1+d/scale)-1 in [-1, 1]. The mixture propagates
# height/width/n_frames/raymap_*/scale settings to every subset (datasets/mixture.py). Each
# subset_id maps to an entry in algorithm.diffusion_forcing.subset_settings.
data_root: null
metadata_path: null
load_prompt_embed: true
load_video_latent: false
scale_preserving: false   # true: divide depth and moments by each dataset's mutual_scale
# scale_mode=parallax normalizes moments and depth per clip by kappa * median(valid depth).
# null: per-clip max, or the mutual_scale constant when scale_preserving. NVS subsets
# (re10k, dl3dv_colmap) ignore it.
scale_mode: null
parallax_kappa: 4.0
# Depth channel under scale_mode=parallax: "log" = 1 - 2*clip(alpha*ln(d/median + 1), 0, 1), which
# survives the VAE round trip far better than "disparity" = 2/(1+d/s) - 1.
parallax_depth_map: log
parallax_log_alpha: 0.30
# Ray channels 3:6 under scale_mode=parallax: "companded_origin" replaces the Pluecker moment with
# the mu-law-companded camera origin sign(t/s)*ln(1+mu|t/s|)/ln(1+mu) (invertible in
# raymap_to_camera); "moment" keeps moment/s.
parallax_ray_encoding: companded_origin
parallax_mu: 255.0
# scale_mode=global_metric divides moments and depth by this one constant (metres) everywhere.
global_metric_scale: 10.0

# 288x384 (4:3): the 16x Wan2.2 VAE latent is 18x24, even for the 2x2 patch.
# Raymap 36x48 = height//8 x width//8. Every subset crops and resizes to this.
height: 288
width: 384
n_frames: 50
fps: 10
raymap_height: 36
raymap_width: 48

training:
  weight_type: relative
  # relative: sampling share_i is proportional to weight_i * n_records_i
  # (mixture_parallax14 overrides these for the release recipe).
  weight:
    tartanair: 0.6077
    tartanair_v2: 0.1636
    spring: 0.5556
    bedlam: 0.011552
    bedlam2: 0.015972
    vkitti2: 0.4000
    ase: 0.005152
    omniworld_game: 0.009821
    re10k: 0.001828
    dl3dv_colmap: 0.011522

validation:
  weight_type: absolute
  weight:
    tartanair: 1.0
    tartanair_v2: 1.0
    spring: 1.0
    bedlam: 1.0
    bedlam2: 1.0
    vkitti2: 1.0
    ase: 1.0
    omniworld_game: 1.0
    re10k: 1.0
    dl3dv_colmap: 1.0

test:
  weight_type: absolute
  weight:
    tartanair: 1.0
    tartanair_v2: 1.0
    spring: 1.0
    bedlam: 1.0
    bedlam2: 1.0
    vkitti2: 1.0
    ase: 1.0
    omniworld_game: 1.0
    re10k: 1.0
    dl3dv_colmap: 1.0
