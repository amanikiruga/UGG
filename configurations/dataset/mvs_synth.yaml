defaults:
  - video_base
  - _self_

# MVS-Synth (DeepMVS): 120 GTA-V sequences x 100 frames, 960x540, per-frame K,
# w2c extrinsics (OpenCV axes), float32 EXR z-depth in metres (inf = sky).
data_root: ${data_dir}/mvs_synth
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/mvs_synth
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Capture rate unknown (large per-frame baselines); sampled consecutively.
fps: 10
fps_source: 10
n_frames: 50
test_percentage: 0.02
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale: max(P90 of the per-clip moment max, P90 depth / 9), metres.
mutual_scale: 79.0

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
