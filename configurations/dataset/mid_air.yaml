defaults:
  - video_base
  - _self_

# Mid-Air (midair.ulg.ac.be): low-altitude drone flights, 1024x1024 @ 25 fps. Metric depth is
# stored as Euclidean ray distance (the loader converts it to z-depth); poses are 100 Hz NED with
# wxyz quaternions. Kite_training (4 climates) + PLE_training (3 seasons).
data_root: ${data_dir}/mid_air
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/mid_air
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Native 25 fps, sampled consecutively to keep per-frame rotation moderate.
fps: 25
fps_source: 25
n_frames: 50
test_percentage: 0.02
# The square source is center-cropped to 4:3 and resized.
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale: max(P90 of the per-clip moment max, P90 depth / 9), metres.
mutual_scale: 52.0

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json

# Static scenes: a time-reversed clip is a valid backward camera path.
allow_temporal_reverse: true
