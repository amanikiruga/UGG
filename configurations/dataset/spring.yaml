defaults:
  - video_base
  - _self_

# Spring (Mehl et al., CVPR'23), left view only, 37 train sequences:
# frame_left/*.png + disp1_left/*.dsp5 + cam_data/*.txt. Same geometry conventions as TartanAir.
data_root: ${data_dir}/spring
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/spring
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Native 24 fps, sampled consecutively (fps == fps_source).
fps: 24
fps_source: 24
n_frames: 50
test_percentage: 0.05   # ~2 sequences held out for validation/test
# The 1920x1080 source is center-cropped to 4:3 and resized.
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale (the dataset's depth P90, metres). With scale_preserving=true, depth and camera
# moments are both divided by it, so every dataset's disparity lands in a similar range while metric
# scale is preserved within the dataset.
mutual_scale: 42.0

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
