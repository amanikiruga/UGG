defaults:
  - video_base
  - _self_

# BEDLAM (synthetic humans), used as a geometry source: RGB, metric EXR depth and per-frame
# Unreal cameras. One loader reads both releases; data_root selects which:
#   v1: <batch>/png + <batch>/depth + <batch>/ground_truth/camera/*.csv
#   v2: <batch>/png + <batch>/exr_depth + <batch>/ground_truth/meta_exr_csv/*.csv
data_root: ${data_dir}/bedlam2
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/bedlam2
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Native 30 fps, sampled consecutively. About half the v1 batches have a moving camera;
# the rest are static (depth-only supervision).
fps: 30
fps_source: 30
n_frames: 50
test_percentage: 0.02
# The 1280x720 source is center-cropped to 4:3 and resized.
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale (see bedlam.yaml); v2 shares v1's depth distribution.
mutual_scale: 63.0

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
