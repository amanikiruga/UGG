defaults:
  - video_base
  - _self_

# TartanAir V2 (CMU AirLab), left front pinhole cube face (lcam_front) only, image + depth,
# all 74 environments, Data_easy + Data_hard.
data_root: ${data_dir}/tartanair_v2
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/tartanair_v2
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
# Same temporal settings as V1 (stride 1). The cube faces are already pinhole.
fps: 10
fps_source: 10
n_frames: 50
test_percentage: 0.02
# The square 640x640 source is center-cropped to 4:3 and resized; K is adjusted.
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale (the dataset's depth P90, metres). With scale_preserving=true, depth and camera
# moments are both divided by it, so every dataset's disparity lands in a similar range while metric
# scale is preserved within the dataset.
mutual_scale: 23.0

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json

# Static scenes: a time-reversed clip is a valid backward camera path.
allow_temporal_reverse: true
