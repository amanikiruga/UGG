defaults:
  - video_base
  - _self_

data_root: ${data_dir}/omniworld_game
metadata_path: metadata.csv
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/omniworld_game
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
max_mean_adj_rotation_deg: 3.5
fps: 24      # chosen for ~0.45 deg/frame camera rotation, matching re10k
n_frames: 49
test_percentage: 0.01
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

# Game footage: depth is self-consistent but not metric, and the cameras barely move. So only
# depth is used: depth_only omits the camera keys, the mixture sets has_raymap=False, and the
# algorithm noise-fills and loss-masks the ray tokens.
depth_only: true

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Per-dataset scale (depth P90, in the game's own units, which are ~100x smaller than metres).
mutual_scale: 0.19

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
