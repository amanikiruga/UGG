defaults:
  - video_base
  - _self_

# ASE (Aria Synthetic Environments): fisheye RGB, ground-truth range depth and poses, laid out as
# <data_root>/<scene id>/{rgb,depth,trajectory.csv}. Frames are undistorted on the fly to a
# 640x480 pinhole using datasets/geometry_verification/aria/ase_undistort_maps_portrait.npz.
data_root: ${data_dir}/ase
metadata_path: ""
load_prompt_embed: true
caption_cache_dir: ${data_dir}/captions/ase
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
fps: 10
fps_source: 10
n_frames: 50
test_percentage: 0.01
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Optional per-clip motion gate: clips that rotate or move faster than these thresholds train
# depth only (has_raymap=False). null disables the gate, so every clip keeps camera supervision.
raymap_max_rot_deg_per_frame: null
raymap_max_parallax: null

# Per-dataset scale (the dataset's depth P90, metres). With scale_preserving=true, depth and camera
# moments are both divided by it, so every dataset's disparity lands in a similar range while metric
# scale is preserved within the dataset.
mutual_scale: 4.5

# Static scenes: a time-reversed clip is a valid backward camera path.
allow_temporal_reverse: true

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
