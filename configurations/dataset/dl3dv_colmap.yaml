defaults:
  - video_base
  - _self_

# DL3DV with its COLMAP poses (nerfstudio transforms.json for 8K-10K, per-frame dense/cam npz for
# 1K-7K). NVS only: COLMAP scale is arbitrary per scene and there is no depth, so it trains like
# re10k (rays as history, predict RGB; diffusion_forcing settings [2, 3]).
data_root: ${data_dir}/dl3dv_colmap
prompt_embeds_root: ${data_dir}/dl3dv_colmap_prompt_embeds
metadata_path: ""
splits: [1K, 2K, 3K, 4K, 5K, 6K, 7K]        # dense layout: dense/{rgb,cam}
splits_flat: [8K, 9K, 10K]                  # flat layout: images_4 + transforms.json

load_prompt_embed: true
load_video_latent: false
trim_mode: random_cut
pad_mode: slowdown
fps: 30      # 30-fps walkthroughs, sampled consecutively
n_frames: 49
test_percentage: 0.01
height: 240
width: 320
raymap_height: 30   # height // 8
raymap_width: 40    # width  // 8

filtering:
  disable: true

augmentation:
  random_flip: null
  ratio: null
  scale: null

# Cached list of records, written on first run; delete it if the data changes.
records_manifest: _records_manifest.json
