defaults:
  - mixture_all              # the base 10 subsets and the scale settings
  - mvs_synth@subset/mvs_synth
  - mid_air@subset/mid_air
  - scenenet@subset/scenenet
  - matrixcity@subset/matrixcity
  - _self_

# The release training mixture: 14 datasets, used with dataset.scale_mode=parallax.
# Roles (diffusion-forcing settings per subset are set in the algorithm config):
#   full geometry:         tartanair, spring, bedlam, bedlam2, vkitti2, mvs_synth, mid_air
#   RGB -> depth + pose:   ase, tartanair_v2, scenenet
#   depth only:            omniworld_game, matrixcity (no camera supervision, has_raymap=False)
#   NVS (no depth):        re10k, dl3dv_colmap
#
# weight_type=relative: sampling share_i is proportional to weight_i * n_records_i. Target shares
# (%): tartanair 18, tartanair_v2 15, re10k 11, dl3dv_colmap 9, ase 8, bedlam 7, bedlam2 7,
# scenenet 6, omniworld 5, vkitti2 4, matrixcity 4, mvs_synth 2.5, mid_air 2.5, spring 1.
mixture_seed: 20260831   # fixed sampling stream

training:
  weight_type: relative
  weight:
    tartanair: 0.6077
    tartanair_v2: 0.106353
    re10k: 0.002684
    ase: 0.001067
    dl3dv_colmap: 0.0141
    bedlam: 0.0110
    bedlam2: 0.0152
    scenenet: 0.0043
    omniworld_game: 0.0086
    vkitti2: 0.4889
    mvs_synth: 0.2589
    mid_air: 0.1617
    spring: 0.3395
    matrixcity: 0.0220
validation:
  weight_type: absolute
  weight:
    tartanair: 1.0
    tartanair_v2: 1.0
    spring: 1.0
    bedlam: 1.0
    bedlam2: 1.0
    vkitti2: 1.0
    ase: 1.0
    omniworld_game: 1.0
    re10k: 1.0
    dl3dv_colmap: 1.0
    mvs_synth: 1.0
    mid_air: 1.0
    scenenet: 1.0
test:
  weight_type: absolute
  weight:
    tartanair: 1.0
    tartanair_v2: 1.0
    spring: 1.0
    bedlam: 1.0
    bedlam2: 1.0
    vkitti2: 1.0
    ase: 1.0
